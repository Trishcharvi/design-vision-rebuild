<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Design Vision DV">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".18" stop-color="#4d9cff"/>
      <stop offset=".42" stop-color="#071d48"/>
      <stop offset=".68" stop-color="#b9e6ff"/>
      <stop offset="1" stop-color="#123d83"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#a9d9ff"/>
      <stop offset=".48" stop-color="#2474d8"/>
      <stop offset=".72" stop-color="#071a3d"/>
      <stop offset=".9" stop-color="#6ebaff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5b2"/>
      <stop offset=".28" stop-color="#ffc928"/>
      <stop offset=".58" stop-color="#df7900"/>
      <stop offset=".82" stop-color="#fff07b"/>
